{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-5Q4KSNXW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <!-- End Google Tag Manager -->
    <title>{% block title %}Best of Bart{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'main/images/favicon.ico' %}">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6847708276252567"
     crossorigin="anonymous"></script>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5Q4KSNXW"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <header>
        <nav>
            <div class="left-navbar">
                <a href="{% url 'home' %}" class="home-btn">Best of Bart</a>
            </div>
            <div class="right-navbar">
                <a href="{% url 'contact' %}" class="contact-btn">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 C.H.M van den Eijnden. All Rights Reserved.</p>
        <a href="{% url 'contact' %}">Contact</a>
        <a href="https://bestofbart.nl/beheer">Beheer</a>
    </footer>

    {% block extra_js %}{% endblock %}
    <script src="{% static 'main/js/script.js' %}"></script>
</body>
</html>
