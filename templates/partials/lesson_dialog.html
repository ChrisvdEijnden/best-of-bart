<dialog class="lesson-dialog" id="lessonDialog" aria-labelledby="popupTitle">
    <div class="popup" id="popup">
        <div class="popup-nav">
            <div class="popup-nav-tabs" role="tablist" aria-label="Lesonderdelen">
                <button type="button" class="tab-btn active" role="tab" id="lesson-tab-0" aria-controls="lesson-panel-0" aria-selected="true" data-tab="0">TikTok</button>
                <button type="button" class="tab-btn" role="tab" id="lesson-tab-1" aria-controls="lesson-panel-1" aria-selected="false" tabindex="-1" data-tab="1">Uitleg</button>
                <button type="button" class="tab-btn" role="tab" id="lesson-tab-2" aria-controls="lesson-panel-2" aria-selected="false" tabindex="-1" data-tab="2">Bestanden</button>
            </div>
            <button type="button" class="close-popup-btn" data-close aria-label="Sluiten">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
                    <path fill="currentColor" d="M10 8.586L2.929 1.515L1.515 2.929L8.586 10l-7.071 7.071l1.414 1.414L10 11.414l7.071 7.071l1.414-1.414L11.414 10l7.071-7.071l-1.414-1.414z" />
                </svg>
            </button>
        </div>

        <div class="popup-tab" role="tabpanel" id="lesson-panel-0" aria-labelledby="lesson-tab-0" data-tab="0">
            <!-- Same destination as the button below, so it's hidden from
                 screen readers and the tab order to avoid a duplicate link. -->
            <a class="popup-media" id="popupMedia" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
                <img id="popupImage" alt="">
                <span class="play-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28"><path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
                </span>
            </a>
            <h2 class="item-title" id="popupTitle"></h2>
            <a class="tiktok-btn" id="popupTiktok" target="_blank" rel="noopener">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
                Bekijk op TikTok
            </a>
        </div>

        <div class="popup-tab" role="tabpanel" id="lesson-panel-1" aria-labelledby="lesson-tab-1" data-tab="1" hidden>
            <p id="popupDescription"></p>
        </div>

        <div class="popup-tab" role="tabpanel" id="lesson-panel-2" aria-labelledby="lesson-tab-2" data-tab="2" hidden>
            <div class="files-list" id="popupFiles"></div>
        </div>
    </div>
</dialog>
